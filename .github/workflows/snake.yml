name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayemaqu
          outputs: |
            dist/github-snake-dark.svg?color_snake=f9a8d4&color_dots=#1a1a2e,#4a0030,#8b0057,#c2185b,#f48fb1

      - name: Fix snake color
        run: |
          sed -i 's/--cs:f9a8d4/--cs:#ffffff/g' dist/github-snake-dark.svg

      - name: Push to snake branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: snake
          force_orphan: true

