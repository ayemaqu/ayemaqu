name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayemaqu
          outputs: |
            dist/github-snake-dark.svg?color_snake=f9a8d4&color_dots=#0d1117,#4a0030,#8b0057,#c2185b,#f48fb1&color_bg=#0d1117

      - name: Push to snake branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: snake
          force_orphan: true
